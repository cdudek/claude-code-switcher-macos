[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent-switcher"
dynamic = ["version"]
description = "macOS menu bar app to switch between Claude Code and Codex CLI accounts instantly"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["claude", "claude-code", "codex", "account-switcher", "macos", "menu-bar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "rumps>=0.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "py2app>=0.28; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/cdudek/code-agent-switcher"

[project.scripts]
code-agent-switcher = "code_agent_switcher.app:main"

[tool.setuptools.dynamic]
version = {attr = "code_agent_switcher.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
